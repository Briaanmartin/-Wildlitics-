name: Wildlitics desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/wildlitics-desktop.yml"
  push:
    branches:
      - "codex/wildlitics-desktop-20261025"
    paths:
      - "desktop/**"
      - ".github/workflows/wildlitics-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the native interface and packaging tool
        run: python -m pip install -e desktop pyinstaller==6.22.3
      - name: Install Linux Qt offscreen libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0
      - name: Test camera imports, review, cancellation and native UI
        run: python -m unittest discover -s desktop/tests -v
      - name: Build the Windows portable application
        if: runner.os == 'Windows'
        run: python desktop/scripts/build_desktop.py
      - name: Test the packaged Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "wildlitics-packaged-check.json"
          $process = Start-Process -FilePath "desktop/dist/Wildlitics/Wildlitics.exe" -ArgumentList @("--self-test", $resultPath) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged self-check failed with exit code $($process.ExitCode)" }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "Packaged self-check did not pass" }
          Get-Content $resultPath
          Copy-Item $resultPath "desktop/dist/Wildlitics/packaged-validation.json"
      - name: Validate the real AI pipeline on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "wildlitics-ai-runtime"
          python -m venv $runtime
          if ($LASTEXITCODE -ne 0) { throw "Could not create AI validation environment" }
          $aiPython = Join-Path $runtime "Scripts/python.exe"
          & $aiPython -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw "CPU PyTorch installation failed" }
          & $aiPython -m pip install speciesnet==5.0.6
          if ($LASTEXITCODE -ne 0) { throw "SpeciesNet installation failed" }
          $image = Join-Path $env:RUNNER_TEMP "speciesnet-upstream-sample.jpg"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/cameratrapai/b9aa454d2f31ee74d71c3b162f4ba6c834e93322/images/sample_image_oct.jpg" -OutFile $image
          $resultFolder = Join-Path $env:RUNNER_TEMP "wildlitics-real-ai-check"
          python desktop/scripts/validate_real_ai.py --image $image --ai-python $aiPython --output $resultFolder
          if ($LASTEXITCODE -ne 0) { throw "Real Windows AI workflow failed" }
          Copy-Item (Join-Path $resultFolder "real-ai-validation.json") "desktop/dist/Wildlitics/real-ai-validation.json"
      - name: Upload the Windows portable application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Wildlitics-Windows-x64
          path: desktop/dist/Wildlitics/
          if-no-files-found: error
          retention-days: 30
