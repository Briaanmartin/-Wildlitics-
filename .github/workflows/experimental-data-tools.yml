name: Experimental data tools

on:
  pull_request:
    paths:
      - "experimental/data-tools/**"
      - ".github/workflows/experimental-data-tools.yml"
  push:
    branches:
      - "codex/wildlitics-development-20261024"
    paths:
      - "experimental/data-tools/**"
      - ".github/workflows/experimental-data-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the image dependency
        run: python -m pip install -r experimental/data-tools/requirements.txt
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Test dataset exports, video sampling and SpeciesNet review import
        run: python -m unittest discover -s experimental/data-tools/tests -v
